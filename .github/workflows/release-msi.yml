name: Build and Release MSI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version x.y.z (optional, default from tag)"
        required: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.*
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Resolve version and tag
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
          } else {
            $inputVersion = "${{ inputs.version }}"
            if (-not $inputVersion) {
              throw "For workflow_dispatch, please provide 'version' input (x.y.z)."
            }
            $version = $inputVersion.TrimStart('v')
            $tag = "v$version"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version '$version'. Expected x.y.z"
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and upload MSI release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          python build.py `
            --version "${{ steps.meta.outputs.version }}" `
            --github-release `
            --github-repo "${{ github.repository }}" `
            --release-tag "${{ steps.meta.outputs.tag }}" `
            --release-name "HRouting v${{ steps.meta.outputs.version }}"
